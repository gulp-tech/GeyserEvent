# ============================================================================
# Схематика ивента «Адский Разлом» (Infernal Rift)
# Портал размещается без физики (applyPhysics=false) и защищён от телепортации!
# Вы также можете сохранить свою постройку из игры командой: /rift saveschem <радиус>
# ============================================================================

name: "infernal_rift"
description: "Алтарь и Врата Адского Разлома с защитой от телепортации"
boss-spawn-offset:
  x: 0.5
  y: 1.0
  z: 2.5
  yaw: 0.0
  pitch: 0.0

# Палитра символов для послойной схемы (11x11, центр в X=5, Z=5)
palette:
  '.': "AIR"
  'B': "BLACKSTONE"
  'P': "POLISHED_BLACKSTONE_BRICKS"
  'C': "CRACKED_POLISHED_BLACKSTONE_BRICKS"
  'G': "GILDED_BLACKSTONE"
  'M': "MAGMA_BLOCK"
  'O': "OBSIDIAN"
  'Y': "CRYING_OBSIDIAN"
  'L': "LODESTONE"
  'W': "POLISHED_BLACKSTONE_WALL"
  'N': "NETHERRACK"
  'F': "SOUL_FIRE"
  'X': "NETHER_PORTAL"
  'S': "SOUL_LANTERN"
  'H': "CRIMSON_NYLIUM"

