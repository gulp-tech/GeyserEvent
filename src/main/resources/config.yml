# ============================================================================
# GeyserEvent v1.1.0 — Ивент «Адский Разлом (Вторжение Босса)» для Purpur 26.2
# Специально разработан для игроков Bedrock Edition (GeyserMC)
# ============================================================================

bedrock:
  # Строгий режим: участвовать в ивенте, наносить урон боссу, получать награды
  # и использовать /event могут ТОЛЬКО игроки с Bedrock Edition (GeyserMC / Floodgate).
  strict-only: true
  # Разрешить администраторам с правом geyserevent.bypass.bedrock обходить проверку
  allow-admin-bypass: true
  # Префикс никнейма Floodgate/Geyser как резервная проверка
  fallback-prefix: "."

resourcepack:
  # Автоматически экспортировать наш кастомный Bedrock ресурспак (GeyserEvent-Pack.mcpack)
  # и копировать его в папку plugins/Geyser-Spigot/packs/ (если она существует)
  auto-install-to-geyser: true
  # Отображать инфо-панель в правом верхнем углу экрана во время ивента
  # (название ивента, координаты, редкость и здоровье босса)
  top-right-hud:
    enabled: true
    title: "&#FF2E2E&l🔥 АДСКИЙ РАЗЛОМ"
    event-display-name: "&#FF4500Адский Разлом"
    rarity-display: "&#FF2E2EМ&#F64620и&#ED5E12ф&#E47604и&#EB8E08ч&#F2A60Cе&#F9BE10с&#FFD614к&#FFE042и&#FFEA70й"

event:
  # Мир, в котором появляется ивент «Адский Разлом» (можно изменить в любой момент)
  world: "world2"
  # Название редкости/лута для плейсхолдера %loot%
  loot-rarity: "&#FF2E2EМ&#F64620и&#ED5E12ф&#E47604и&#EB8E08ч&#F2A60Cе&#F9BE10с&#FFD614к&#FFE042и&#FFEA70й"
  # Автоматический запуск ивента по таймеру
  auto-start: true
  # Интервал между автоматическими запусками (в минутах)
  interval-minutes: 60
  # Максимальная длительность ивента (в минутах), если босса не убили
  duration-minutes: 25
  # Минимальное количество Bedrock-игроков онлайн для авто-старта
  min-bedrock-players: 1
  # Задержка перед очисткой схематики после убийства босса (в секундах)
  cleanup-delay-seconds: 20

  # Настройки GPS-трекера (/event gps)
  gps:
    # На каком расстоянии (в блоках) от ивента трекер автоматически отключается
    # и показывает игроку подробную информацию об ивенте
    arrival-distance: 10.0
    # Показывать ли путеводные частицы перед игроком в сторону ивента
    particle-trail: true

  # Настройки поиска случайных координат в мире world2
  spawn:
    center-x: 0
    center-z: 0
    min-radius: 100
    max-radius: 1000
    max-attempts: 35

schematic:
  # Файл схематики в папке plugins/GeyserEvent/schematics/
  file: "infernal_rift.schem.yml"
  # Восстанавливать ли исходный ландшафт после завершения ивента
  restore-blocks-on-end: true
  # Запрещать ли ломать и ставить блоки в зоне схематики Разлома
  protect-region: true
  protection-radius: 12
  # Блокировать телепортацию игроков и мобов через портал Адского Разлома
  disable-portal-teleport: true

boss:
  # Отображаемое имя босса (%hp% и %max_hp% обновляются в реальном времени)
  name: "&4&lБрутальный Владыка Разлома &8[&c%hp%&7/&c%max_hp% ❤&8]"
  # Здоровье босса (3500 HP)
  health: 3500.0
  # Чистый урон от удара босса (15 ед.)
  damage: 15.0
  # Размер босса в метрах и множитель масштаба (Attribute.SCALE в Purpur 26.2)
  height-meters: 2.0
  scale: 1.22
  # Оружие в главной руке: Незеритовый топор
  weapon:
    material: "NETHERITE_AXE"
    name: "&4&lСекира Адского Разлома"
    enchanted-glow: true
  # Скорость передвижения и сопротивление откидыванию
  movement-speed: 0.35
  knockback-resistance: 0.85
  # Максимальная дистанция увода босса от портала (в блоках)
  leash-radius: 35.0
  # Защита от стрельбы из лука/арбалета с огромной дистанции (дальше 28 блоков)
  max-ranged-attack-distance: 28.0

minions:
  # Призыв приспешников боссом раз в некоторое время
  enabled: true
  summon-interval-seconds: 25
  count-per-wave: 3
  max-active: 8
  entity-type: "PIGLIN_BRUTE"
  name: "&cПриспешник Разлома &7[%hp% ❤]"
  health: 60.0
  damage: 7.0
  scale: 0.92
  weapon: "GOLDEN_AXE"

  # Настройка лута и опыта, выпадающего с приспешников босса:
  # Адские предметы, опыт, алмазы, золото и редко — всё что связано с незеритом
  loot:
    enabled: true
    min-exp: 50
    max-exp: 120
    # Оповещать ли в чат при выпадении редкого незеритового предмета
    announce-rare-drops: true
    items:
