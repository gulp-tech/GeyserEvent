  - { x: 2,  y: 0, z: 5,  material: "SUSPICIOUS_SAND" }
  - { x: -5, y: 0, z: -2, material: "SUSPICIOUS_SAND" }
  - { x: 5,  y: 0, z: -2, material: "SUSPICIOUS_SAND" }
  - { x: -5, y: 0, z: 2,  material: "SUSPICIOUS_SAND" }
  - { x: 5,  y: 0, z: 2,  material: "SUSPICIOUS_SAND" }

