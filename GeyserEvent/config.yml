# ============================================================================
worldguard:
  # Автоматически создавать и обновлять регион «geyserevent_mine» вокруг
  # «Шахты Древних» (0 ~ 0), чтобы регионы WorldGuard НЕ мешали ломать
  # руды и Древние жеоды, а также открывать меню Древнего Кузнеца.
  # Если WorldGuard не установлен — настройка просто игнорируется.
  sync-mine-region: true

messages:
  prefix: "&e┠ &r"
  only-bedrock: "&e┠ &cДоступно только для игроков с Bedrock Edition."
  portal-no-teleport: "&e┠ &cТелепортация через этот портал отключена."
  region-protected: "&e┠ &cЗдесь нельзя ломать или ставить блоки."

  # Сообщение появления ивента «Адский Разлом»
  spawn-broadcast:
    - '&e┠ &#34D711А&#41CF10д&#4EC80Eс&#5BC00Dк&#68B90Bи&#75B10Aй&#81A909-&#8EA207Р&#9B9A06а&#A89304з&#B58B03л&#C28402о&#CF7C00м &fпоявился на карте.'
    - '&e┠ &fЗдоровье: &c%hp% ❤'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

  # Сообщение появления ивента «Пляжные Раскопки»
  excavation-spawn-broadcast:
    - '&e┠ &#34D711П&#40CE10л&#4CC50Eя&#58BC0Dж&#64B30Bн&#70AA0Aы&#7CA109е-&#889807Р&#948F06а&#A08605с&#AC7D03к&#B87402о&#C46B01п&#CF7C00к&#DB8500и &fпоявились на карте.'
    - '&e┠ &fЖитель выдаёт кисточку: &#E0C912каждые 30 сек.'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

  # Сообщение появления ивента «Котёл Алхимика»
  cauldron-spawn-broadcast:
    - '&e┠ &#34D711К&#42CE0Fо&#50C50Eт&#5EBC0Cё&#6CB30Bл-&#7AAA09А&#88A108л&#969806х&#A48F05и&#B28603м&#C07D02и&#CE7400к&#DC6B00а &fпоявился на карте.'
    - '&e┠ &fСобирайте реагенты на болоте и сдавайте Алхимику!'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

  # /event delay (до начала ивента — НЕ показывает какой ивент будет следующим!)
  delay-waiting:
    - '&e┠ &fДо появления следующего ивента: &#E0C912%time%'

  # /event delay (когда идёт «Адский Разлом»)
  delay-active:
    - '&e┠ &#34D711А&#41CF10д&#4EC80Eс&#5BC00Dк&#68B90Bи&#75B10Aй&#81A909-&#8EA207Р&#9B9A06а&#A89304з&#B58B03л&#C28402о&#CF7C00м &fактивен на карте.'
    - '&e┠ &fЗдоровье: &c%hp%/%max_hp% ❤'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

  # /event delay (когда идут «Пляжные Раскопки»)
  excavation-delay-active:
    - '&e┠ &#34D711П&#40CE10л&#4CC50Eя&#58BC0Dж&#64B30Bн&#70AA0Aы&#7CA109е-&#889807Р&#948F06а&#A08605с&#AC7D03к&#B87402о&#C46B01п&#CF7C00к&#DB8500и &fактивны на карте.'
    - '&e┠ &fДо конца раскопок: &#E0C912%remaining%'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

  # /event delay (когда идёт «Котёл Алхимика»)
  cauldron-delay-active:
    - '&e┠ &#34D711К&#42CE0Fо&#50C50Eт&#5EBC0Cё&#6CB30Bл-&#7AAA09А&#88A108л&#969806х&#A48F05и&#B28603м&#C07D02и&#CE7400к&#DC6B00а &fактивен на карте.'
    - '&e┠ &fДо конца ивента: &#E0C912%remaining%'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

# ============================================================================
# Ивент «Вторжение Пришельцев» (v1.20.0)
# Кастомный босс-пришелец с кастомной текстурой на схематике-посадке 25x25.
# После убийства босса на 4 пьедесталах открываются сундуки с ресурсами.
# 3D-модели из аддона al3xandre привязаны в ресурспаке к ванильным сущностям
# (Geyser не умеет спавнить ale:alien / ale:nave с Java-сервера):
#   EVOKER → geometry.alien (босс), VEX → мелкий alien, GHAST → тарелка geometry.nave.
# Эвокер/векс/гаст в обычном мире почти не встречаются, поэтому обычный геймплей не ломается.
# ============================================================================
alien:
  enabled: true
  # Длительность ивента в минутах (после этого пришелец улетает)
  duration-minutes: 15
  # Радиус защиты постройки: внутри неё блоки не ломаются и не ставятся
  protection-radius: 13

  # ---- Босс-пришелец ----
  # Тип моба на Java: VINDICATOR — нормальный ближний ИИ (бежит и бьёт).
  # На Bedrock модель заменена на 3D-пришельца. EVOKER оставлен в паке как запасной.
  # Не ставьте броню — она рисуется поверх кастомной модели.
  boss-type: "VINDICATOR"
  # Имя: %hp% — текущее HP, %max_hp% — максимум
  boss-name: "&5&lПришелец-Владыка &8[&d%hp%&7/&d%max_hp% ❤&8]"
  boss-health: 16000.0
  boss-damage: 24.0
  # Размер модели (1.0 — ванильный). Модель alien и так высокая (~3 блока).
  boss-scale: 1.55
  boss-movement-speed: 0.32
  boss-knockback-resistance: 1.0
  # Радиус преследования: босс идёт к игрокам в этом радиусе (помогает выбраться из арены)
  boss-chase-range: 25.0
  # Броня выключена: нетэрит поверх 3D-модели пришельца выглядит как каша.
  boss-armor: false
  # Предмет в руке босса (AIR — без оружия; у виндicator свой топор, в паке не рисуется)
  boss-weapon: "AIR"

  # ---- Малые пришельцы (приспешники) ----
  minions:
    enabled: true
    # VINDICATOR — ходят и бьют по земле (VEX летали хаотично). Модель — мелкий пришелец.
    type: "VINDICATOR"
    name: "&a&lМалый пришелец &7[%hp% ❤]"
    health: 160.0
    damage: 16.0
    scale: 0.55
    weapon: "AIR"
    interval-seconds: 25
    count-per-wave: 2
    max-active: 4
    trigger-radius: 25.0

  # Летающая тарелка над ареной (модель nave из пака al3xandre на сущности GHAST).
  # Неуязвима, без ИИ, не стреляет, не коллизится с игроками.
  ufo:
    enabled: true
    type: "GHAST"
    height: 10.0
    scale: 0.45

  # Интервал способностей босса (pull/push/gather из общего раздела abilities)
  ability-interval-seconds: 14

  # ---- Сундуки с ресурсами после убийства босса ----
  chests:
    enabled: true
    # Сколько секунд сундуки доступны после убийства босса (затем площадка откатывается)
    loot-time-seconds: 180
    # Сколько раз кидать кубик на предмет в каждом сундуке (помимо базы)
    rolls-per-chest: 8
    # Смещения сундуков от центра ивента (x y z) — 4 пьедестала схемы
    offsets:
      - "0 2 9"
      - "9 2 0"
      - "0 2 -9"
      - "-9 2 0"
    # ГАРАНТИРОВАННЫЙ базовый лут: эти предметы ВСЕГДА есть в каждом сундуке
    # (не зависят от шансов и роллов). Хватит, чтобы лут никогда не был пустым.
    # Гарантированный базовый лут: эти предметы ВСЕГДА есть в каждом сундуке
    # (не зависят от шансов и роллов). Ключ — произвольное название.
    base-loot:
      iron:
        material: "IRON_INGOT"
        min: 3
        max: 6
      gold:
        material: "GOLD_INGOT"
        min: 2
        max: 4
      emerald:
        material: "EMERALD"
        min: 2
        max: 4
      diamond:
        material: "DIAMOND"
        min: 1
        max: 2
    # Обычный / эпический / легендарный лут сундуков (свой chance у каждого).
    loot:
      common_item1:
        material: "GOLD_INGOT"
        min: 4
        max: 4
        chance: 45.0
        rare: false
      common_item2:
        material: "IRON_INGOT"
