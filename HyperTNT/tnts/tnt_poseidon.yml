# ═══════════════════════════════════════════════════════
#   Посейдон — Разрушитель баз (ПОЛНЫЙ РЕЙД)
#   Способен взрывать Обсидиан + приваты
# ═══════════════════════════════════════════════════════

tnt_poseidon:
  enabled: true

  item:
    material: TNT
    custom_model_data: 0
    enchanted: true
    name: '&9&lПосейдон'
    lore:
      - '&8Разрушитель баз'
      - ''
      - ' &8▸ &fОписание:'
      - '   &8▸ &fСпособен взрывать &5Обсидиан&f.'
      - '   &8▸ &fПолностью &cуничтожает &fприваты.'

  ignite:
    fuse-seconds: 3.5
    auto-ignite-on-place: false
    velocity:
      gravity: true
      upward: 0.0
    throw:
      enabled: false
      hand: any
      velocity-xz: 0.9
      velocity-y: 0.2
      auto-ignite: false
    allow:
      flint-and-steel: true
      fire-charge: true
      redstone: true
      fire: true
      explosion: true

  craft:
    enabled: true
    disable_vanilla_craft: false
    shape:
      - OEO
      - ETG
      - OEO
    ingredients:
      O: OBSIDIAN
      E: END_CRYSTAL
      T: TNT
      G: GUNPOWDER

  conditions: []

  visual:
    sounds:
      ignite:
        enabled: true
        sound: ENTITY_TNT_PRIMED
        volume: 1.5
        pitch: 0.7
      explosion:
        enabled: true
        sound: ENTITY_GENERIC_EXPLODE
        volume: 6.0
        pitch: 0.5
    particles:
      enabled: true
      type: WATER_SPLASH
      count: 80
      offset:
        x: 0.8
        y: 0.8
        z: 0.8
      extra: 0.05
    hologram:
      enabled: true
      type: armorstand
      line-spacing: 0.25
      lines:
        - '&9&lПосейдон'
        - '&7Взрыв через: &9{time}s'
        - '&3🌊 Разрушитель баз'
      height: 2.0
      update-period-ticks: 4
      displaytext:
        shadowed: true
        see-through: false
        default-background: false
        background-color: '#00000000'
        line-width: 200
        text-opacity: 255
        billboard: FIXED
        alignment: CENTER
        scale: 1.0
        glowing: false
        glow-color: '#FFFFFFFF'
    glow:
      enabled: true
      color: BLUE
      animation:
        enabled: true
        colors:
          - BLUE
          - DARK_BLUE
          - AQUA
          - DARK_AQUA
          - BLUE
        period-ticks: 8

  # ═══════════════════════════════════════════════
  #  ВЗРЫВ — ЛОМАЕТ ВСЁ
  # ═══════════════════════════════════════════════
