      - '&e┼ &#34D711В&#41CE0FН&#4EC80EТ&#5BC00DО&#68B90BР&#75B10AЖ&#81A909Е&#8EA207Н&#9B9A06И&#A89304Е &#B58B03П&#C28402Р&#CF7C00И&#DC6B00Ш&#E96200Е&#F65900Л&#FF5000Ь&#FF5000Ц&#FF5000Е&#FF5000В &fна карте!'
      - '&e┠ &fНа посадочной площади появился Пришелец-Владыка &8(&d%hp% ❤&8)'
