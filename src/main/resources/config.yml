# ============================================================================
# GeyserEvent v1.4.0 — Ивенты «Адский Разлом» и «Пляжные Раскопки» (Purpur 26.2)
# Специально разработан для игроков Bedrock Edition (GeyserMC)
# ============================================================================

bedrock:
  # Строгий режим: участвовать в ивенте, наносить урон боссу, получать награды
  # и использовать /event могут ТОЛЬКО игроки с Bedrock Edition (GeyserMC / Floodgate).
  strict-only: true
  # Разрешить администраторам с правом geyserevent.bypass.bedrock обходить проверку
  allow-admin-bypass: true
  # Префикс никнейма Floodgate/Geyser как резервная проверка
  fallback-prefix: "."

resourcepack:
  # Автоматически экспортировать Bedrock ресурспак (GeyserEvent-Pack.mcpack)
  # и копировать его в папку plugins/Geyser-Spigot/packs/
  auto-install-to-geyser: true
  # Отображать инфо-панель в правом верхнем углу экрана во время ивента
  # (через BossBar и GeyserEvent-Pack.mcpack — НЕ трогает Scoreboard сервера!)
  top-right-hud:
    enabled: true
    title: "&#FF2E2E&lАДСКИЙ РАЗЛОМ"
    event-display-name: "&#34D711Адский-Разлом"
    excavation-display-name: "&#34D711Пляжные-Раскопки"
    rarity-display: "&#FF2E2EМ&#F64620и&#ED5E12ф&#E47604и&#EB8E08ч&#F2A60Cе&#F9BE10с&#FFD614к&#FFE042и&#FFEA70й"

event:
  # Мир, в котором появляются ивенты «Адский Разлом» и «Пляжные Раскопки»
  world: "world2"
  # Название редкости для плейсхолдера %loot%
  loot-rarity: "&#FF2E2EМ&#F64620и&#ED5E12ф&#E47604и&#EB8E08ч&#F2A60Cе&#F9BE10с&#FFD614к&#FFE042и&#FFEA70й"
  # Автоматический запуск случайного ивента по таймеру
  auto-start: true
  # Интервал между автоматическими запусками (в минутах)
  interval-minutes: 60
  # Длительность ивента (в минутах). Через 20 минут ивент пропадает.
  duration-minutes: 20
  # Минимальное количество Bedrock-игроков онлайн для авто-старта
  min-bedrock-players: 1
  # Задержка перед очисткой после убийства босса (в секундах)
  cleanup-delay-seconds: 15

  # Настройки локатора (/event gps)
  gps:
    # На каком расстоянии (в блоках) от ивента локатор автоматически молча отключается
    arrival-distance: 10.0
    # Показывать ли путеводные частицы перед игроком в сторону ивента
    particle-trail: true

  # Настройки поиска случайных координат в мире world2
  spawn:
    center-x: 0
    center-z: 0
    min-radius: 100
    max-radius: 1000
    max-attempts: 35

schematic:
  file: "infernal_rift.schem.yml"
  restore-blocks-on-end: true
  protect-region: true
  protection-radius: 12
  disable-portal-teleport: true

