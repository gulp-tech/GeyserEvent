abilities:
  # Радиус действия всех способностей босса (15 блоков)
  radius: 15.0
  cast-interval-seconds: 14

  # 1. Притягивание игроков к боссу (в радиусе 15 блоков)
  pull:
    enabled: true
    horizontal-strength: 1.65
    vertical-boost: 0.42
    damage: 4.0
    slowness-ticks: 40

  # 2. Отталкивание игроков ударной волной от босса (в радиусе 15 блоков)
  push:
    enabled: true
    horizontal-strength: 2.05
    vertical-boost: 0.65
    damage: 6.0

  # 3. Собрать всех игроков в одно место (гравитационная воронка в радиусе 15 блоков)
  gather:
    enabled: true
    distance-in-front: 3.5
    damage: 5.0
    slowness-ticks: 60

rewards:
  # Название донат-валюты (через плагин PlayerPoints)
  currency-name: "осколков"
  use-playerpoints-api: true
  fallback-command: "points give %player% %amount%"
  places:
    1: 3000
    2: 2000
    3: 1000

messages:
  prefix: "&e┠ &r"
  only-bedrock: "&e┠ &cЭтот ивент доступен только для игроков с Bedrock Edition (GeyserMC)!"
  portal-no-teleport: "&e┠ &cПортал Адского Разлома нестабилен — телепортация заблокирована!"
  region-protected: "&e┠ &cВы не можете ломать или ставить блоки в зоне Адского Разлома!"
  ability-pull: "&e┠ &6⚡ &fБрутальный Пиглин &#FF8C00притянул &fвас к себе цепями Разлома!"
  ability-push: "&e┠ &c💥 &fБрутальный Пиглин &#FF3333оттолкнул &fвсех сокрушительной волной!"
  ability-gather: "&e┠ &d🌀 &fБрутальный Пиглин &#D442FFстянул всех в одну точку &fперед собой!"
  ability-minions: "&e┠ &4🔥 &fВладыка Разлома призвал подкрепление приспешников из портала!"
  rare-minion-drop: "&e┠ &fИгрок &#E0C912%player% &fвыбил редкий дроп с приспешника: &#FF4500%item% &7(x%amount%)"

  # Сообщение при появлении ивента (в вашем фирменном стиле)
  spawn-broadcast:
    - '&e┠ &#34D711А&#41CF10д&#4EC80Eс&#5BC00Dк&#68B90Bи&#75B10Aй&#81A909-&#8EA207Р&#9B9A06а&#A89304з&#B58B03л&#C28402о&#CF7C00м &fпоявился на карте.'
    - '&e┠ &fРедкость: %loot%'
    - '&e┠ &fЗдоровье босса: &c%hp% ❤ &7(Урон: &c%damage%&7)'
    - '&e┠ &fМир: &#E0C912%world%'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'
    - '&e┠ &fПоставить GPS-трекер: &#34D711/event gps'

  # Сообщение /event delay (когда ивент еще не начался)
  delay-waiting:
    - '&e┠ &fДо появления ивента &#34D711А&#48CC0Fд&#5CC10Dс&#70B60Bк&#84AB09и&#98A007й &#AC9505Р&#C08A03а&#D47F01з&#E0C912л&#B58B03о&#CF7C00м&f:'
    - '&e┠ &fОсталось времени: &#E0C912%time%'
    - '&e┠ &fМир появления: &#E0C912%world%'

  # Сообщение /event delay (когда ивент уже идет)
  delay-active:
    - '&e┠ &#34D711А&#41CF10д&#4EC80Eс&#5BC00Dк&#68B90Bи&#75B10Aй&#81A909-&#8EA207Р&#9B9A06а&#A89304з&#B58B03л&#C28402о&#CF7C00м &fуже активен на карте!'
    - '&e┠ &fЗдоровье босса: &c%hp%/%max_hp% ❤'
    - '&e┠ &fМир: &#E0C912%world%'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'
    - '&e┠ &fДо конца ивента: &#E0C912%remaining%'
    - '&e┠ &fВключить трекер: &#34D711/event gps'

  # Информация об ивенте, когда игрок с /event gps подошел ближе чем на 10 блоков
  gps-arrived-info:
    - '&e┠ &#34D711Вы прибыли к ивенту Адский Разлом! &7(GPS-трекер отключён)'
    - '&e┠ &fБосс: &cБольшой Брутальный Пиглин (2м)'
    - '&e┠ &fЗдоровье: &c%hp%/%max_hp% ❤ &7| &fУрон: &c%damage%'
    - '&e┠ &fРедкость: %loot%'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'
    - '&e┠ &fНаграды: &61м: &d%r1% &7| &f2м: &d%r2% &7| &c3м: &d%r3% %currency%'
