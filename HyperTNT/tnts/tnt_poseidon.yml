    radius: 8.0

    damage:
      enabled: true
      max-damage: 25.0
      min-damage: 5.0
      exposure: 1.0

    raycast:
      rays: 64
      strength-multiplier: 4.0
      resistance-multiplier: 0.05

    blocks:
      in-liquid: true
      max-blocks: 0

      # ═══ РЕЖИМ ПО УМОЛЧАНИЮ ═══
      default:
        mode: BREAK
        drop-chance: 0.9

      # ═══ ПЕРЕОПРЕДЕЛЕНИЕ ═══
      per-material:

        # ─── БЛОКИ ПРИВАТОВ — ЛОМАЮТСЯ ───
        GOLD_BLOCK:
          mode: BREAK
          drop-chance: 1.0
        DIAMOND_BLOCK:
          mode: BREAK
          drop-chance: 1.0
        DIAMOND_ORE:
          mode: BREAK
