# ============================================================================
# Схематика ивента «Вторжение Пришельцев» (посадочная площадь 25x25)
# OPEN ARENA: босс появляется по центру на открытой площадке (Y=0),
# без капсулы, стены или оболочки — перемещение по площади не ограничено.
# По центру (0.5, 1.0, 0.5) появляется босс-пришелец, вокруг — 4 пьедестала,
# на которых после его смерти плагин ставит сундуки с ресурсами.
# Генератор: .packtools/make_alien_schematic.py
# ============================================================================

