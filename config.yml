# ============================================================================
# GeyserEvent v1.4.0 — Ивенты «Адский Разлом» и «Пляжные Раскопки» (Purpur 26.2)
# Специально разработан для игроков Bedrock Edition (GeyserMC)
# ============================================================================

bedrock:
  # Строгий режим: если false — участвовать и брать кисточки могут и игроки с телефонов, и игроки с Bedrock ПК без ограничений.
  strict-only: false
  # Разрешить администраторам с правом geyserevent.bypass.bedrock обходить проверку
  allow-admin-bypass: true
  # Префикс никнейма Floodgate/Geyser как резервная проверка
  fallback-prefix: .

resourcepack:
  # Автоматически экспортировать Bedrock ресурспак (GeyserEvent-Pack.mcpack)
  # и копировать его в папку plugins/Geyser-Spigot/packs/
  auto-install-to-geyser: true
  # Путь к папке packs Geyser. Пусто = автоопределение plugins/Geyser-Spigot/packs
  # (когда плагин Geyser-Spigot стоит прямо на этом сервере).
  # Если Geyser — отдельный прокси (Standalone/BungeeCord/Velocity), укажите путь к его packs,
  # например: "/home/geyser/packs". Если путь недоступен — плагин напишет в консоли,
  # какой файл куда скопировать вручную.
  geyser-packs-dir: ''
  # Java-ресурспак со звуком кареты. Без него playSound кастомного ключа молчит.
  java-pack-url: https://raw.githubusercontent.com/gulp-tech/GeyserEvent/arena/0d820c4a-geyserevent/GeyserEvent-Java-Pack.zip
  # Ресурспак GeyserEvent-Pack.mcpack: 3D-рюкзак шахтёра и текстуры блоков призыва.
  # Панель ивента в углу экрана убрана в v1.9.29 — настройки ниже не используются,
  # но оставлены для будущего. Информация ивента: только BossBar сверху + GPS в action bar.
  top-right-hud:
    enabled: true
    # Информационный BossBar ивента убран в v1.9.23 (функция удалена из плагина).
    # Панель в углу экрана убрана в v1.9.29: ресурспак больше не меняет HUD клиента.
    title: '&#FF2E2E&lАДСКИЙ РАЗЛОМ'
    event-display-name: '&#34D711Адский-Разлом'
    excavation-display-name: '&#34D711Пляжные-Раскопки'
    cauldron-display-name: '&#34D711Котёл-Алхимика'
    rarity-display: '&#FF2E2EМ&#F64620и&#ED5E12ф&#E47604и&#EB8E08ч&#F2A60Cе&#F9BE10с&#FFD614к&#FFE042и&#FFEA70й'
    # Своя иконка у каждого ивента: показывается в чат-сообщениях ивентов.
    # (в панель эти символы не попадают — панель в углу экрана убрана).
    icon-infernal-rift: ☠
    icon-excavation: ⚓
    icon-cauldron: ⚗
    icon-mine: ⛏

event:
  # Мир, в котором появляются ивенты «Адский Разлом» и «Пляжные Раскопки»
  world: world2
  # Название редкости для плейсхолдера %loot%
  loot-rarity: '&#FF2E2EМ&#F64620и&#ED5E12ф&#E47604и&#EB8E08ч&#F2A60Cе&#F9BE10с&#FFD614к&#FFE042и&#FFEA70й'
  # Автоматический запуск случайного ивента по таймеру
  auto-start: true
  # Интервал между автоматическими запусками (в минутах)
  interval-minutes: 40
  # Длительность ивента (в минутах). Через 20 минут ивент пропадает.
  duration-minutes: 20
  # Минимум игроков онлайн для АВТО-старта, если у ивента нет своего числа.
  # Ручной запуск (/rift start, /rift start-here) всегда без проверки.
  min-bedrock-players: 5
  # Сколько игроков нужно, чтобы этот ивент сам появился по таймеру.
  # Меняется командой: /rift minplayers <rift|excavation|cauldron|wind|all> <число>
  auto-min-players:
    rift: 5
    excavation: 5
    cauldron: 5
    wind: 5
    skibidi: 5
    ronaldo: 5
    fishing: 5
    newyear: 5
  # Задержка перед очисткой после убийства босса (в секундах)
  cleanup-delay-seconds: 15
  
  # Настройки локатора (/event gps)
  gps:
    # На каком расстоянии (в блоках) от ивента локатор автоматически молча отключается
    arrival-distance: 10.0
    # Показывать ли путеводные частицы перед игроком в сторону ивента
    particle-trail: true
  
  # Настройки поиска случайных координат в мире world2
  spawn:
    center-x: 0
    center-z: 0
    min-radius: 100
    max-radius: 1000
    max-attempts: 35

schematic:
  file: infernal_citadel_25.schem.yml
  restore-blocks-on-end: true
  protect-region: true
  protection-radius: 13
  disable-portal-teleport: true

