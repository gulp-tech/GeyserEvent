# ============================================================================
# ПРИЗЫВНЫЕ ИВЕНТЫ: алтарь призыва «Адского Разлома»
# Специальные блоки с кастомными текстурами из ресурспака (GeyserEvent-Pack.mcpack).
# Админ ставит алтарь: /rift summonaltar  (рядом сами встанут 4 пилона)
# Игрок жмёт ПКМ по алтарю -> отсчёт -> на месте алтаря стартует «Адский Разлом».
# ============================================================================
summon:
  enabled: true
  # В каком мире работает призыв (ваш PvP-мир). В других мирах алтарь ответит,
  # что тут призывать нельзя. Пусто = тот же мир, что и event.world.
  world: "pvp"
  # Сколько секунд идёт призыв до появления босса
  wait-seconds: 120
  # Радиус в блоках: если рядом с алтарём/боссом никого нет — призыв или ивент
  # отменяется (см. idle-no-players-seconds)
  player-radius: 40
  # Сколько секунд подряд можно быть без игроков в радиусе, пока призыв/ивент
  # не отменится сам
  idle-no-players-seconds: 60
  # Сколько секунд боссу можно не наносить урон, пока ивент не отменится
  idle-no-damage-seconds: 90
  # Через сколько секунд призванный босс исчезает, если его не убили
  boss-timeout-seconds: 300
  # Что написать в чат, когда призванный босс исчез по таймауту
  timeout-message: "&e┠ &cПризванный босс вернулся в Разлом — его не успели убить!"
  # Выпадает ли алтарь предметом, если призыв сорвался.
  # false (как сейчас) — блок просто исчезает, на пол ничего не падает.
  drop-altar-on-fail: false
  # Блоки структуры. ВНИМАНИЕ: кастомные текстуры в ресурспаке привязаны
  # именно к этим блокам — если поменяете блок, текстура на него не встанет
  # (блок останется ванильным). Все пять блоков редкие, поэтому обычные
  # постройки игроков не поменяются.
  altar-block: REINFORCED_DEEPSLATE
  pylon-1-block: OCHRE_FROGLIGHT
  pylon-2-block: VERDANT_FROGLIGHT
  pylon-3-block: PEARLESCENT_FROGLIGHT
  pylon-4-block: BUDDING_AMETHYST

