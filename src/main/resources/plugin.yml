name: GeyserEvent
version: '1.0.0'
main: ru.geyserevent.GeyserEventPlugin
api-version: '1.21'
authors: [GeyserEvent]
description: Адский Разлом (Вторжение Босса) для Purpur 26.2 — только для игроков Bedrock (GeyserMC) с наградами через PlayerPoints
softdepend:
  - Geyser-Spigot
  - floodgate
  - PlayerPoints

commands:
  rift:
    description: Главное меню и управление ивентом «Адский Разлом» (Bedrock GeyserMC)
    aliases: [event, geyserevent, razlom, infernalrift]
    usage: /<command> [menu|top|compass|start|start-here|stop|ability|setworld|saveschem|reload]

permissions:
  geyserevent.use:
    description: Доступ к меню и участию в ивенте Адский Разлом (только для Bedrock игроков)
    default: true
  geyserevent.admin:
    description: Полное управление ивентом Адский Разлом (старт, стоп, настройка, способности)
    default: op
  geyserevent.bypass.bedrock:
    description: Позволяет администраторам с Java-клиента управлять ивентом и тестировать его
    default: op
