# ═══════════════════════════════════════════════════════
#   Тяжёлый фугас — Абсолютное разрушение
#   Радиус: 10 | Таймер: 4s | Ломает обсидиан++ | Огонь: 25%
#   ✅ УНИЧТОЖАЕТ ПРИВАТЫ
# ═══════════════════════════════════════════════════════

tnt_heavy:
  enabled: true

  item:
    material: TNT
    custom_model_data: 0
    enchanted: true
    name: '&c&lТяжёлый фугас'
    lore:
      - '&8Абсолютное разрушение'
      - ''
      - ' &8▸ &fХарактеристики:'
      - '   &8▸ &fРадиус взрыва: &a10 блоков'
      - '   &8▸ &fСпец. эффект: &4Разрушает обсидиан++'
      - '   &8▸ &fУничтожает &cприваты&f.'

  ignite:
    fuse-seconds: 4.0
    auto-ignite-on-place: false
    velocity:
      gravity: true
      upward: 0.15
    throw:
      enabled: false
      hand: any
      velocity-xz: 0.9
      velocity-y: 0.2
      auto-ignite: false
    allow:
      flint-and-steel: true
      fire-charge: true
      redstone: true
      fire: true
      explosion: true

  craft:
    enabled: true
    disable_vanilla_craft: false
    shape:
      - GEG
      - ETG
      - GEG
    ingredients:
      G: GUNPOWDER
      E: END_CRYSTAL
      T: TNT

  conditions: []

  visual:
    sounds:
      ignite:
        enabled: true
        sound: ENTITY_TNT_PRIMED
        volume: 1.5
        pitch: 0.7
      explosion:
        enabled: true
        sound: ENTITY_GENERIC_EXPLODE
        volume: 6.0
        pitch: 0.6
    particles:
      enabled: true
      type: LAVA
      count: 60
      offset:
        x: 0.6
        y: 0.6
        z: 0.6
      extra: 0.0
    hologram:
      enabled: true
      type: armorstand
      line-spacing: 0.25
      lines:
        - '&c&lТяжёлый фугас'
        - '&7Взрыв через: &4{time}s'
        - '&4☠ Абсолютное разрушение'
      height: 2.0
      update-period-ticks: 4
      displaytext:
        shadowed: true
        see-through: false
        default-background: false
        background-color: '#00000000'
        line-width: 200
        text-opacity: 255
        billboard: FIXED
        alignment: CENTER
        scale: 1.0
        glowing: false
        glow-color: '#FFFFFFFF'
    glow:
      enabled: true
      color: DARK_RED
      animation:
        enabled: true
        colors:
          - DARK_RED
          - RED
          - GOLD
          - RED
          - DARK_RED
        period-ticks: 6

  # ═══════════════════════════════════════════════
  #  ВЗРЫВ
  # ═══════════════════════════════════════════════
  explosion:
    radius: 10.0

    damage:
      enabled: true
      max-damage: 30.0
      min-damage: 4.0
      exposure: 1.0

    raycast:
      rays: 48
      strength-multiplier: 3.5
      resistance-multiplier: 0.05

    blocks:
      in-liquid: false
      max-blocks: 0

      # ═══ РЕЖИМ ПО УМОЛЧАНИЮ ═══
      default:
        mode: BREAK
        drop-chance: 0.85

      # ═══ ПЕРЕОПРЕДЕЛЕНИЕ ДЛЯ КОНКРЕТНЫХ БЛОКОВ ═══
      per-material:

        # ─── БЛОКИ ПРИВАТОВ — УНИЧТОЖАЮТСЯ ───
        GOLD_BLOCK:
          mode: BREAK
          drop-chance: 1.0
        DIAMOND_BLOCK:
          mode: BREAK
          drop-chance: 1.0
        DIAMOND_ORE:
          mode: BREAK
          drop-chance: 1.0
        EMERALD_ORE:
          mode: BREAK
          drop-chance: 1.0

        # ─── УСИЛЕННЫЕ БЛОКИ ───
        OBSIDIAN:
          mode: BREAK
          drop-chance: 0.6
        CRYING_OBSIDIAN:
          mode: BREAK
          drop-chance: 0.6
        REINFORCED_DEEPSLATE:
          mode: BREAK
          drop-chance: 0.4
        NETHERITE_BLOCK:
          mode: BREAK
          drop-chance: 1.0

        # ─── ХРАНИЛИЩА ───
        ENDER_CHEST:
          mode: BREAK
