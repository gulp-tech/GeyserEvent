name: Build GeyserEvent Plugin

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload GeyserEvent JAR
        uses: actions/upload-artifact@v4
        with:
          name: GeyserEvent-1.0.0
          path: target/GeyserEvent-1.0.0.jar
