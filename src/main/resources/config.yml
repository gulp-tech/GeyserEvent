  pull:
    enabled: true
    horizontal-strength: 1.65
    vertical-boost: 0.42
    damage: 4.0
    slowness-ticks: 40

  push:
    enabled: true
    horizontal-strength: 2.05
    vertical-boost: 0.65
    damage: 6.0

  gather:
    enabled: true
    distance-in-front: 3.5
    damage: 5.0
    slowness-ticks: 60

rewards:
  currency-name: "осколков"
  use-playerpoints-api: true
  fallback-command: "points give %player% %amount%"
  places:
    1: 3000
    2: 2000
    3: 1000

messages:
  prefix: "&e┠ &r"
  only-bedrock: "&e┠ &cДоступно только для игроков с Bedrock Edition (GeyserMC)."
  portal-no-teleport: "&e┠ &cТелепортация через этот портал отключена."
  region-protected: "&e┠ &cЗдесь нельзя ломать или ставить блоки."

  # Сообщение появления ивента
  spawn-broadcast:
