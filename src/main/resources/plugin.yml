name: GeyserEvent
version: '1.21.44'
main: ru.geyserevent.GeyserEventPlugin
api-version: '1.21'
authors: [GeyserEvent]
description: Ивенты «Адский Разлом», «Пляжные Раскопки», «Котёл Алхимика», «Вторжение Пришельцев», «Сердце Ветра», призывные алтари, «Шкибиди», «Роналду SIUU» и «Шахта Древних 45x45 (0 ~ 0)» для Purpur 1.21–26.63
loadbefore:
  - HyperTNT
softdepend:
  - Geyser-Spigot
  - WorldGuard
  - floodgate
  - PlayerPoints
  - DeluxeMenus
  - Essentials
  - EssentialsX

commands:
  event:
    description: Команды ивентов для игроков (/event delay, /event gps, /event mine, /event backpack)
    aliases: [ivent]
    usage: /<command> <delay|gps|mine|backpack>
  rift:
    description: Админ-команды управления ивентами и GUI-меню лута
    aliases: [geyserevent, razlom, infernalrift]
    usage: /<command> <menu|minemenu|cauldronmenu|excavationmenu|mine|start|start-here|stop|mineloot|cauldronloot|brushloot|copylot|minplayers|givegeode|givereagent|givebrush|ability|setworld|saveschem|summonaltar|summonlist|summonremove|givesummon|reload|status|top>
    permission: geyserevent.admin
  cauldronmenu:
    description: Отдельное GUI-меню настройки лута «Котла Алхимика»
    aliases: [alchemistmenu, cmenu]
    usage: /<command> [обычная|эпическая|легендарная]
    permission: geyserevent.admin
  minemenu:
    description: Отдельное GUI-меню настройки лута постоянного ивента «Шахта Древних (0 ~ 0)»
    aliases: [geodemenu, mmenu]
    usage: /<command> [обычная|эпическая|легендарная]
    permission: geyserevent.admin
  klad:
    description: Запустить ивент «Древний клад» (один сундук в руинах)
    aliases: [drevniy, ancientklad]
    usage: /<command> [here|stop]
    permission: geyserevent.admin
  skibidi:
    description: Запустить ивент «Шкибиди Туалет»
    aliases: [toilet, shkibid]
    usage: /<command> [here|stop]
    permission: geyserevent.admin
  ronaldo:
    description: Запустить ивент «Роналду SIUU»
    aliases: [cr7, siuu, ronaldu]
    usage: /<command> [here|stop]
    permission: geyserevent.admin
  fishing:
    description: Запустить ивент «Рыбалка»
    aliases: [rybalka, fish]
    usage: /<command> [here|stop]
    permission: geyserevent.admin

permissions:
  geyserevent.use:
    description: Доступ к командам /event delay, /event gps и /event mine
    default: true
  geyserevent.admin:
    description: Полное управление всеми ивентами и меню лута (/rift, /cauldronmenu, /minemenu)
    default: op
  geyserevent.bypass.bedrock:
    description: Позволяет администраторам с Java-клиента управлять ивентами и тестировать их
    default: op
