name: GeyserEvent
version: '1.1.0'
main: ru.geyserevent.GeyserEventPlugin
api-version: '1.21'
authors: [GeyserEvent]
description: Адский Разлом (Вторжение Босса) для Purpur 26.2 — только для игроков Bedrock (GeyserMC) с собственным ресурспаком HUD, GPS-трекером и наградами через PlayerPoints
softdepend:
  - Geyser-Spigot
  - floodgate
  - PlayerPoints

commands:
  event:
    description: Команды ивента для игроков (/event delay, /event gps)
    aliases: [events, ivent]
    usage: /<command> <delay|gps>
  rift:
    description: Админ-команды управления ивентом «Адский Разлом»
    aliases: [geyserevent, razlom, infernalrift]
    usage: /<command> <start|start-here|stop|ability|setworld|saveschem|reload|status|top>
    permission: geyserevent.admin

permissions:
  geyserevent.use:
    description: Доступ к командам /event delay и /event gps (только для Bedrock игроков)
    default: true
  geyserevent.admin:
    description: Полное управление ивентом Адский Разлом (/rift start, stop, ability, setworld, saveschem, reload)
    default: op
  geyserevent.bypass.bedrock:
    description: Позволяет администраторам с Java-клиента управлять ивентом и тестировать его
    default: op
