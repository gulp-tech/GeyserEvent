  # ВСЕГДА видят и атакуют игрока, даже если он выпил зелье невидимости.
  ignore-invisibility: true
  # Пока идёт временный ивент, зелье невидимости снимается с игроков внутри
  # зоны ивента (НПС ивента всегда замечают игрока).
  strip-invisibility-in-events: true
  # То же самое внутри зоны постоянного ивента «Шахта Древних» (0 ~ 0).
  strip-invisibility-in-mine: false

