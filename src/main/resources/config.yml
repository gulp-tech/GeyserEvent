    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

  # /event delay (когда идёт «Котёл Алхимика»)
  cauldron-delay-active:
    - '&e┠ &#34D711К&#42CE0Fо&#50C50Eт&#5EBC0Cё&#6CB30Bл-&#7AAA09А&#88A108л&#969806х&#A48F05и&#B28603м&#C07D02и&#CE7400к&#DC6B00а &fактивен на карте.'
    - '&e┠ &fДо конца ивента: &#E0C912%remaining%'
    - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'

# ============================================================================
# Ивент «Вторжение Пришельцев» (v1.20.0)
# Кастомный босс-пришелец с кастомной текстурой на схематике-посадке 25x25.
# После убийства босса на 4 пьедесталах открываются сундуки с ресурсами.
# Текстуры пришельцев перекрашивают ванильные (ресурспак), форма модели — ванильная,
# поэтому никаких сбоев на клиенте: меняются только эвокер и векс, которые в
# естественном мире почти не встречаются.
# ============================================================================
alien:
  enabled: true
  # Длительность ивента в минутах (после этого пришелец улетает)
  duration-minutes: 15
  # Радиус защиты постройки: внутри неё блоки не ломаются и не ставятся
  protection-radius: 13

  # ---- Босс-пришелец ----
  # Тип моба: EVOKER (по умолчанию), RAVAGER, WARDEN, VINDICATOR, PILLAGER, ZOGLIN...
  # У каждого типа в ресурспаке своя перекрашенная текстура пришельца.
  boss-type: "EVOKER"
  # Имя: %hp% — текущее HP, %max_hp% — максимум
  boss-name: "&5&lПришелец-Владыка &8[&d%hp%&7/&d%max_hp% ❤&8]"
  boss-health: 16000.0
  boss-damage: 24.0
  # Размер модели (1.0 — ванильный)
  boss-scale: 1.35
  boss-movement-speed: 0.32
  boss-knockback-resistance: 1.0
  # Радиус преследования: босс идёт к игрокам в этом радиусе (помогает выбраться из арены)
  boss-chase-range: 25.0
  # Броня босса: нетэрит-броня по всем слотам (бессмертная, не выпадает).
  # Даёт ~10 очков брони — урон игрока заметно падает.
  boss-armor: true
  # Предмет в руке босса (AIR — без оружия)
  boss-weapon: "AIR"

  # ---- Малые пришельцы (приспешники) ----
  minions:
    enabled: true
    # Тип моба: VEX (по умолчанию, летают), ZOGLIN, VINDICATOR, PILLAGER...
    type: "VEX"
    name: "&a&lМалый пришелец &7[%hp% ❤]"
    health: 160.0
    damage: 16.0
    scale: 1.15
    weapon: "AIR"
    # Как часто звать подкрепление (чем меньше HP босса, тем чаще)
    interval-seconds: 15
    count-per-wave: 6
    max-active: 14
    trigger-radius: 25.0

  # Интервал способностей босса (pull/push/gather из общего раздела abilities)
  ability-interval-seconds: 14

  # ---- Сундуки с ресурсами после убийства босса ----
  chests:
    enabled: true
    # Сколько секунд сундуки доступны после убийства босса (затем площадка откатывается)
    loot-time-seconds: 180
    # Сколько раз кидать кубик на предмет в каждом сундуке (помимо базы)
    rolls-per-chest: 8
    # Смещения сундуков от центра ивента (x y z) — 4 пьедестала схемы
    offsets:
      - "0 2 9"
      - "9 2 0"
      - "0 2 -9"
      - "-9 2 0"
    # ГАРАНТИРОВАННЫЙ базовый лут: эти предметы ВСЕГДА есть в каждом сундуке
    # (не зависят от шансов и роллов). Хватит, чтобы лут никогда не был пустым.
    # Гарантированный базовый лут: эти предметы ВСЕГДА есть в каждом сундуке
    # (не зависят от шансов и роллов). Ключ — произвольное название.
    base-loot:
      iron:
        material: "IRON_INGOT"
        min: 3
        max: 6
      gold:
        material: "GOLD_INGOT"
        min: 2
        max: 4
      emerald:
        material: "EMERALD"
        min: 2
        max: 4
      diamond:
        material: "DIAMOND"
        min: 1
        max: 2
    # Лут: material (материал), min/max (количество), chance (шанс в %),
    # rare (true — легендарный лут), name (название предмета), lore (строки описания)
    # Ключ — произвольное название для идентификации в /rift menu
    loot:
      diamond:
        material: "DIAMOND"
        min: 1
        max: 3
        chance: 60
        rare: false
      emerald:
        material: "EMERALD"
        min: 2
        max: 5
        chance: 70
        rare: false
      gold_ingot:
        material: "GOLD_INGOT"
        min: 3
        max: 8
        chance: 80
        rare: false
      experience_bottle:
        material: "EXPERIENCE_BOTTLE"
        min: 4
        max: 10
        chance: 65
        rare: false
      amethyst_shard:
        material: "AMETHYST_SHARD"
        min: 4
        max: 12
        chance: 75
        rare: false
      netherite_ingot:
        material: "NETHERITE_INGOT"
        min: 1
        max: 1
        chance: 20
        rare: true
        name: "&#34D711Инопланетный слиток"
        lore:
          - "&7Добыто из корабля пришельцев"
      ancient_debris:
        material: "ANCIENT_DEBRIS"
        min: 1
        max: 2
        chance: 12
        rare: true
      netherite_scrap:
        material: "NETHERITE_SCRAP"
        min: 1
        max: 2
        chance: 10
        rare: true
      netherite_upgrade_template:
        material: "NETHERITE_UPGRADE_SMITHING_TEMPLATE"
        min: 1
        max: 1
        chance: 6
        rare: true
      netherite_sword:
        material: "NETHERITE_SWORD"
        min: 1
        max: 1
        chance: 3
        rare: true
      netherite_pickaxe:
        material: "NETHERITE_PICKAXE"
        min: 1
        max: 1
        chance: 3
        rare: true
      netherite_chestplate:
        material: "NETHERITE_CHESTPLATE"
        min: 1
        max: 1
        chance: 2
        rare: true
      netherite_leggings:
        material: "NETHERITE_LEGGINGS"
        min: 1
        max: 1
        chance: 2
        rare: true
      netherite_helmet:
        material: "NETHERITE_HELMET"
        min: 1
        max: 1
        chance: 2
        rare: true
      netherite_boots:
        material: "NETHERITE_BOOTS"
        min: 1
        max: 1
        chance: 2
        rare: true
      diamond_block:
        material: "DIAMOND_BLOCK"
        min: 1
        max: 2
        chance: 15
        rare: true
      golden_apple:
        material: "GOLDEN_APPLE"
        min: 1
        max: 2
        chance: 20
        rare: false
      enchanted_golden_apple:
        material: "ENCHANTED_GOLDEN_APPLE"
        min: 1
        max: 1
        chance: 8
        rare: true
      totem_of_undying:
        material: "TOTEM_OF_UNDYING"
        min: 1
        max: 1
        chance: 5
        rare: true

  # ---- Награды за урон (общие с Разломом rewards.places и rewards.currency-name) ----
  rewards:
    enabled: true

  # ---- Сообщения (%x% %y% %z% %world% %hp% %max_hp% %currency%) ----
  messages:
    spawn:
      - '&e┼ &#34D711В&#41CE0FН&#4EC80EТ&#5BC00DО&#68B90BР&#75B10AЖ&#81A909Е&#8EA207Н&#9B9A06И&#A89304Е &#B58B03П&#C28402Р&#CF7C00И&#DC6B00Ш&#E96200Е&#F65900Л&#FF5000Ь&#FF5000Ц&#FF5000Е&#FF5000В &fна карте!'
      - '&e┠ &fНа посадочной площади появился Пришелец-Владыка &8(&d%hp% ❤&8)'
      - '&e┠ &fУбейте его — откроются 4 сундука с ресурсами'
      - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'
    defeated:
      - '&e┼ &#34D711Пришелец-Владыка повержен! &fЭкипаж судна открыл хранилища.'
    chests: '&e┼ &#34D711Открылись 4 сундука с ресурсами &f— ищите их на пьедесталах посадки!'
    timeout: '&e┼ &cПришелец вернулся на корабль — его не успели убить!'

    # /event delay (когда идёт «Вторжение Пришельцев»)
    delay-active:
      - '&e┼ &#34D711Вторжение Пришельцев &fактивно на карте.'
      - '&e┠ &fЗдоровье пришельца: &c%hp%/%max_hp% ❤'
      - '&e┠ &fДо конца ивента: &#E0C912%remaining%'
      - '&e┠ &fКоординаты: &#E0C912%x% %y% %z%'
