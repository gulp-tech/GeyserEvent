# Лут сундуков пришельцев (секция alien.chests)
  chests:
    enabled: true
    # Сколько секунд сундуки доступны после убийства босса (затем площадка откатывается)
    loot-time-seconds: 180
    # Сколько раз кидать кубик на предмет в каждом сундуке (помимо базы)
    rolls-per-chest: 8
    # Смещения сундуков от центра ивента (x y z) — 4 пьедестала схемы
    offsets:
      - "0 2 9"
      - "9 2 0"
      - "0 2 -9"
      - "-9 2 0"
    # ГАРАНТИРОВАННЫЙ базовый лут: эти предметы ВСЕГДА есть в каждом сундуке
    # (не зависят от шансов и роллов). Хватит, чтобы лут никогда не был пустым.
    # Гарантированный базовый лут: эти предметы ВСЕГДА есть в каждом сундуке
    # (не зависят от шансов и роллов). Ключ — произвольное название.
    base-loot:
      iron:
        material: "IRON_INGOT"
        min: 3
        max: 6
      gold:
        material: "GOLD_INGOT"
        min: 2
        max: 4
      emerald:
        material: "EMERALD"
        min: 2
        max: 4
      diamond:
        material: "DIAMOND"
        min: 1
        max: 2
